# CodeQL code scanning, advanced setup.
#
# This replaces GitHub's "default setup", which analysed all three languages on every
# pull request whatever it touched: about four minutes of Rust analysis for a change to the
# changelog. Default setup has no path filters, so the only way to scope it is this file.
#
# What is different from default setup:
#   - Rust, the slow analysis, runs on a pull request only when the pull request touches
#     Rust (the `scope` job). The workflow and C analyses take under a minute each and run
#     on every pull request: GitHub compares a pull request's results with `main` per
#     analysis, and reports "configurations not found" for each one that did not run, so
#     skipping the cheap ones bought a warning on most pull requests for no real saving.
#     A pull request without Rust changes still carries that warning for the Rust analysis.
#   - A newer push to the same pull request cancels the analysis still running for the
#     older one.
#   - `main` is still analysed in full on every push, and weekly, so the baseline that pull
#     requests are compared against is always complete.
#
# The analysis itself is unchanged: the same three languages, the default query suite, and
# build mode `none` (no compilation), as default setup used.
#
# Before this workflow can upload results, default setup must be switched off
# (Settings → Code security → Code scanning → CodeQL analysis → Switch to advanced).
# GitHub rejects uploads from a workflow while default setup is on.
#
# github/codeql-action is GitHub's own action, in the `github` org rather than `actions`;
# it is the one default setup was already running.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Does this change need the Rust analysis? On anything but a pull request: yes.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          all='["actions","c-cpp","rust"]'
          if [ "$EVENT" != "pull_request" ]; then
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          # Rust runs when Rust changed, or when this workflow or its config changed (so the
          # change is tested against every language).
          picked='["actions","c-cpp"]'
          if echo "$files" | grep -Eq '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/|^src/vendor/|^\.github/(workflows/codeql\.yml|codeql/)'; then
            picked=$all
          fi
          echo "languages=$picked" >> "$GITHUB_OUTPUT"
          echo "analysing: $picked"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
