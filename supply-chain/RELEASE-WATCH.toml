# Project Kennel — upstream release monitoring
#
# Covers the gap left by `cargo audit` and the RustSec feed: legitimate
# upstream bug fixes and maintenance changes that do NOT trigger a CVE or
# advisory but may still matter to Kennel's stability or correctness
# (CODING-STANDARDS.md §5.7).
#
# A weekly CI job polls each upstream feed and opens a single tracking
# issue summarising any direct dependency with an unreviewed release. The
# maintainer on rotation reads the release notes and either acts (follow
# §5.5 to update the checksum manifest) or marks the release seen-and-
# skipped by updating `last-reviewed` here with a one-line note.
#
# Principle: SEEING an upstream release is automated; DECIDING about it is
# not.
#
# Entry format (one per DIRECT dependency):
#
# [[watch]]
# name          = "<crate>"
# repo          = "https://github.com/<org>/<repo>"
# release-feed  = "https://github.com/<org>/<repo>/releases.atom"
# last-reviewed = "vX.Y.Z"
# reviewed-by   = "<maintainer>"
# note          = "optional — e.g. why a release was deliberately skipped"
#
# Maintenance-signal note (§5.7): a change of upstream maintainer is itself
# a supply-chain signal (the xz-utils precedent). Record an ownership change
# here and trigger a fresh `cargo vet` audit at that dependency's next
# release.

[[watch]]
name          = "libc"
repo          = "https://github.com/rust-lang/libc"
release-feed  = "https://github.com/rust-lang/libc/releases.atom"
last-reviewed = "0.2.186"
reviewed-by   = "remco"
note          = "First dependency. Pinned =0.2.186; underlies kennel-lib-syscall FFI."

[[watch]]
name          = "nix"
repo          = "https://github.com/nix-rust/nix"
release-feed  = "https://github.com/nix-rust/nix/releases.atom"
last-reviewed = "0.31.3"
reviewed-by   = "remco"
note          = "Direct dep of kennel-lib-syscall (safe syscall wrappers). Pinned =0.31.3, default-features off. Transitives bitflags/cfg-if/cfg_aliases are not direct deps and are not separately watched (§5.7)."

[[watch]]
name          = "seccompiler"
repo          = "https://github.com/rust-vmm/seccompiler"
release-feed  = "https://github.com/rust-vmm/seccompiler/releases.atom"
last-reviewed = "0.5.0"
reviewed-by   = "remco"
note          = "Direct dep of kennel-lib-syscall (seccomp-BPF filter compiler). Pinned =0.5.0, default features (no json/serde). bitflags is now also a direct dep but already watched implicitly via nix; not separately listed."

[[watch]]
name          = "object"
repo          = "https://github.com/gimli-rs/object"
release-feed  = "https://github.com/gimli-rs/object/releases.atom"
last-reviewed = "0.36.7"
reviewed-by   = "remco"
note          = "Direct dep of kennel-lib-bpf (ELF parsing). Pinned =0.36.7, features = [read_core, elf]."

[[watch]]
name          = "mini-sansio-dbus"
repo          = "https://github.com/iliabylich/mini-sansio-dbus"
release-feed  = "https://github.com/iliabylich/mini-sansio-dbus/releases.atom"
last-reviewed = "6.0.1"
reviewed-by   = "remco"
note          = "Direct dep of kennel-lib-dbus (the D-Bus mediation engine for facade-dbus, §7.7), the D-Bus wire marshalling. Pinned =6.0.1, vendored byte-identical — v6.0.1 carries the header-field-decoder panic fix (merged upstream from our PR #1), so the 5.0.1 local patch is dropped. 5.0.2/5.0.3 were seen-and-skipped: reviewed 2026-08-13, neither carries the fix (PR #1 was merged 2026-07-20, after v5.0.3; both 5.0.x still panic). Young/single-author upstream — a maintenance-signal crate (§5.7)."

[[watch]]
name          = "ed25519-compact"
repo          = "https://github.com/jedisct1/rust-ed25519-compact"
release-feed  = "https://github.com/jedisct1/rust-ed25519-compact/releases.atom"
last-reviewed = "2.4.2"
reviewed-by   = "remco"
note          = "Direct dep of kennel-lib-policy (Ed25519 verify on the spawn path; since 2.4.x also the SSHSIG SHA-512 via its public `sha512` module). Pinned =2.4.2. 2.4.0/2.4.1 seen-and-skipped: 2.4.0 broke the std-without-pem build (ct_codecs reexport gated on the wrong feature — our report, their #41, fixed in 2.4.2); 2.4.1 carried only a wasm inline fix. Entry added 2026-08-19; the crate previously had no watch entry (a gap against the one-per-direct-dep rule)."
